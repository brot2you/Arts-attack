<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARTS ATTACK! — Arts plastiques de la 6e à la 3e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#f3ede1;
    --canvas-dark:#e8dfcd;
    --charcoal:#2b2622;
    --ink:#3a332c;
    --ochre:#c8792f;
    --ochre-dark:#a35f1f;
    --clay:#b3543a;
    --sage:#5f7a5a;
    --sage-dark:#425940;
    --cream:#fffaf0;
    --line:#d8cdb6;
    --gold:#d4a24c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Space Grotesk', sans-serif;
    background:var(--canvas);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(0,0,0,0.02) 0, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(0,0,0,0.02) 0, transparent 40%);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:40px;
  }
  .brand{
    font-family:'Caveat', cursive;
    font-weight:700;
  }
  header{
    padding:22px 18px 16px;
    text-align:center;
    border-bottom:3px solid var(--charcoal);
    background:var(--cream);
    position:relative;
  }
  header h1{
    margin:0;
    font-size:2.4em;
    color:var(--charcoal);
  }
  header .sub{
    font-size:0.85em;
    color:#7a7062;
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .xp-bar{
    max-width:420px;
    margin:10px auto 0;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:0.8em;
    color:var(--ochre-dark);
    font-weight:600;
  }
  .xp-track{
    flex:1;
    height:8px;
    background:var(--line);
    border-radius:6px;
    overflow:hidden;
  }
  .xp-fill{
    height:100%;
    background:linear-gradient(90deg,var(--gold),var(--ochre));
    transition:width .4s ease;
  }
  main{
    max-width:640px;
    margin:0 auto;
    padding:18px 16px;
  }
  .crumbs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:16px;
    font-size:0.82em;
  }
  .crumb{
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:20px;
    padding:5px 12px;
    cursor:pointer;
    color:var(--ink);
  }
  .crumb.active{
    background:var(--charcoal);
    color:var(--cream);
    border-color:var(--charcoal);
  }
  h2.section-title{
    font-family:'Caveat', cursive;
    font-size:2em;
    margin:6px 0 14px;
    color:var(--charcoal);
  }
  .grid{
    display:grid;
    gap:12px;
  }
  .level-card{
    background:var(--cream);
    border:2px solid var(--charcoal);
    border-radius:14px;
    padding:16px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:transform .15s ease;
  }
  .level-card:active{transform:scale(0.98);}
  .level-card .tag{
    position:absolute;
    top:12px;
    right:14px;
    font-size:0.7em;
    background:var(--sage);
    color:#fff;
    padding:3px 9px;
    border-radius:10px;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .level-card h3{
    margin:0 0 4px;
    font-size:1.5em;
    font-family:'Caveat', cursive;
    color:var(--ochre-dark);
  }
  .level-card p{margin:0;font-size:0.88em;color:#5c5347;}
  .level-progress{
    margin-top:10px;
    height:6px;
    background:var(--line);
    border-radius:6px;
    overflow:hidden;
  }
  .level-progress > div{
    height:100%;
    background:var(--sage);
  }
  .q-card{
    background:var(--cream);
    border:2px solid var(--charcoal);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
    cursor:pointer;
  }
  .q-card h3{
    margin:0 0 6px;
    font-size:1.2em;
    color:var(--charcoal);
  }
  .q-card .desc{font-size:0.85em;color:#6b6255;}
  .q-card .meta{
    margin-top:10px;
    display:flex;
    gap:8px;
    font-size:0.75em;
    color:var(--ochre-dark);
    font-weight:600;
  }
  .pill{
    background:var(--canvas-dark);
    border-radius:20px;
    padding:3px 10px;
  }
  .btn{
    display:inline-block;
    background:var(--charcoal);
    color:var(--cream);
    border:none;
    border-radius:10px;
    padding:12px 18px;
    font-size:0.95em;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    width:100%;
    text-align:center;
    margin-top:6px;
  }
  .btn:active{transform:scale(0.98);}
  .btn.secondary{
    background:transparent;
    color:var(--charcoal);
    border:2px solid var(--charcoal);
  }
  .btn.ochre{background:var(--ochre);}
  .btn.sage{background:var(--sage);}
  .back-link{
    background:none;
    border:none;
    color:var(--ochre-dark);
    font-weight:600;
    cursor:pointer;
    font-size:0.9em;
    padding:0 0 12px;
    display:inline-block;
  }
  .card-flip{
    background:var(--cream);
    border:2px solid var(--line);
    border-radius:14px;
    padding:20px;
    margin-bottom:12px;
    min-height:120px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    cursor:pointer;
  }
  .card-flip .term{
    font-family:'Caveat', cursive;
    font-size:1.7em;
    color:var(--clay);
    margin:0 0 6px;
  }
  .card-flip .def{
    font-size:0.9em;
    line-height:1.5;
    color:var(--ink);
    display:none;
  }
  .card-flip.open .def{display:block;}
  .card-flip .hint{font-size:0.72em;color:#9c9182;}
  .quiz-q{
    background:var(--cream);
    border:2px solid var(--charcoal);
    border-radius:14px;
    padding:18px;
  }
  .quiz-q .qn{font-size:0.75em;color:var(--ochre-dark);font-weight:700;margin-bottom:6px;}
  .quiz-q .qtext{font-size:1.05em;margin-bottom:14px;line-height:1.4;}
  .choice{
    display:block;
    width:100%;
    text-align:left;
    background:var(--canvas);
    border:2px solid var(--line);
    border-radius:10px;
    padding:11px 14px;
    margin-bottom:8px;
    font-family:inherit;
    font-size:0.92em;
    cursor:pointer;
  }
  .choice.correct{background:#e3ecdf;border-color:var(--sage-dark);}
  .choice.wrong{background:#f3e0da;border-color:var(--clay);}
  .explain{
    margin-top:12px;
    font-size:0.85em;
    background:var(--canvas-dark);
    border-radius:10px;
    padding:10px 12px;
    display:none;
    line-height:1.4;
  }
  .explain.show{display:block;}
  .quiz-progress{
    display:flex;
    gap:4px;
    margin-bottom:14px;
  }
  .quiz-progress span{
    flex:1;
    height:5px;
    border-radius:4px;
    background:var(--line);
  }
  .quiz-progress span.done{background:var(--sage);}
  .quiz-progress span.current{background:var(--ochre);}
  .result-box{
    text-align:center;
    background:var(--cream);
    border:2px solid var(--charcoal);
    border-radius:16px;
    padding:26px 18px;
  }
  .result-box .score{
    font-family:'Caveat', cursive;
    font-size:3em;
    color:var(--ochre-dark);
    margin:6px 0;
  }
  .defi-box{
    background:var(--sage);
    color:#fff;
    border-radius:14px;
    padding:18px;
    margin-top:16px;
  }
  .defi-box h4{
    margin:0 0 8px;
    font-family:'Caveat', cursive;
    font-size:1.4em;
  }
  .defi-box p{margin:0;font-size:0.9em;line-height:1.5;}
  .badge-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:14px;
    justify-content:center;
  }
  .badge{
    background:var(--gold);
    color:var(--charcoal);
    font-size:0.75em;
    font-weight:700;
    padding:6px 12px;
    border-radius:20px;
  }
  .glossary-search{
    width:100%;
    padding:10px 14px;
    border-radius:10px;
    border:2px solid var(--charcoal);
    font-family:inherit;
    font-size:0.95em;
    margin-bottom:14px;
    background:var(--cream);
  }
  input[type="checkbox"]{
    width:20px;
    height:20px;
    flex-shrink:0;
    accent-color:var(--sage-dark);
    margin-top:2px;
  }
  .timeline-card{
    background:var(--cream);
    border:2px solid var(--charcoal);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
    cursor:pointer;
  }
  .timeline-card .dates{
    font-size:0.75em;
    color:var(--ochre-dark);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .timeline-card h3{
    font-family:'Caveat', cursive;
    font-size:1.6em;
    margin:2px 0 6px;
    color:var(--charcoal);
  }
  .timeline-card .desc{
    font-size:0.88em;
    color:#5c5347;
    display:none;
  }
  .timeline-card.open .desc{display:block;}
  .oeuvre-row{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    border-top:1px solid var(--line);
    font-size:0.85em;
  }
  .oeuvre-row .titre{font-weight:600;}
  .oeuvre-row .meta{color:#8a8072;font-size:0.9em;}
  .technique-card{
    background:var(--cream);
    border:2px solid var(--charcoal);
    border-radius:14px;
    padding:16px;
    margin-bottom:16px;
  }
  .technique-card h3{
    font-family:'Caveat', cursive;
    font-size:1.7em;
    margin:0 0 4px;
    color:var(--clay);
  }
  .technique-card .intro{font-size:0.88em;color:#6b6255;margin-bottom:10px;}
  .technique-card ol{padding-left:20px;margin:10px 0;}
  .technique-card li{margin-bottom:6px;font-size:0.92em;line-height:1.4;}
  .astuce-box{
    background:var(--canvas-dark);
    border-radius:10px;
    padding:10px 12px;
    font-size:0.85em;
    margin-top:10px;
  }
  .visual-box{
    margin:14px 0;
    display:flex;
    justify-content:center;
  }
  .value-bar{
    width:100%;
    max-width:280px;
    height:36px;
    border-radius:8px;
    background:linear-gradient(90deg,#fdfaf3,#2b2622);
    border:2px solid var(--charcoal);
  }
  .color-wheel{
    width:200px;
    height:200px;
    border-radius:50%;
    border:3px solid var(--charcoal);
  }

/* Creative Studio : interface accessible, responsive et plus ludique */
:root{--canvas:#eff5f8;--canvas-dark:#dfeef6;--charcoal:#19334c;--ink:#25394b;--ochre:#e2783e;--ochre-dark:#a54320;--clay:#bf4272;--sage:#277b71;--sage-dark:#175c55;--cream:#ffffff;--line:#c8dce6;--gold:#f6bb4b}
body{background:radial-gradient(circle at 5% 10%,#ffe8c8,transparent 36%),radial-gradient(circle at 94% 15%,#d4e9ff,transparent 36%),#eff5f8}
header{background:linear-gradient(125deg,#fff0d7,#fffbf4 45%,#dbf0ff);border-bottom:4px solid #19334c;padding:26px 15px 22px}
header h1{font-size:3.1em;text-shadow:2px 3px 0 #ffd7a3}
header .sub{font-weight:700;color:#516a76}
main{max-width:880px}
.level-card,.q-card,.technique-card,.timeline-card,.quiz-q,.card-flip,.result-box{border:2px solid #224563;box-shadow:0 6px 0 #bdd5df;border-radius:19px}
.level-card{background:linear-gradient(150deg,#fff,#f7fcff);min-height:135px}
.level-card h3{color:#125d89;font-size:1.85em}
.level-card:hover,.q-card:hover{transform:translateY(-2px)}
.btn{border-radius:13px;min-height:46px}
.btn.ochre{background:#bc4568}
.btn.sage{background:#247d70}
.crumb{font-weight:600}
:focus-visible{outline:3px solid #e07828!important;outline-offset:3px}
.creative-hero{background:linear-gradient(120deg,#193958,#286f93);color:white;border-radius:22px;padding:22px;margin:10px 0 22px;box-shadow:0 8px 0 #bcd4df;position:relative;overflow:hidden}
.creative-hero h2{font-family:'Caveat',cursive;font-size:2.5em;margin:4px 0}
.creative-hero p{max-width:590px;line-height:1.55}
.creative-hero .hero-mark{font-size:2.6em;letter-spacing:.1em}
.creative-hero button{background:#ffcf6b;color:#25394b;border:2px solid #fff;border-radius:13px;font-size:1em;font-weight:800;padding:13px 18px;cursor:pointer}
.mission-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.mission-card{background:white;border:2px solid #224563;border-radius:18px;padding:17px;box-shadow:0 5px 0 #bcd4df}
.mission-card h3{font-size:1.3em;margin:7px 0;color:#174d75}
.mission-card p{font-size:.9em;line-height:1.5}
.mission-icon{font-size:2.1em}
.mission-label{font-size:.77em;color:#277b71;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.mission-section{background:white;border:2px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;line-height:1.6}
.mission-section h3{margin:0 0 9px;color:#134a70}
.mission-section ul{padding-left:21px}
.mission-section li{margin:6px 0}
.mission-section textarea{display:block;width:100%;min-height:95px;border:2px solid #a6c4d4;border-radius:12px;padding:12px;font:inherit;margin-top:8px;resize:vertical}
.mission-section label{display:block;font-weight:700;margin:10px 0}
.mission-pill{display:inline-block;padding:6px 10px;background:#dff3ef;border-radius:20px;color:#175c55;font-size:.8em;font-weight:700}
.mission-alert{background:#fff1d8;padding:12px;border-radius:12px;font-size:.9em}
.mission-card button{margin-top:7px}
.source-note{font-size:.78em;color:#465f6b;line-height:1.5;margin:14px 0}
@media(min-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}} 
@media(max-width:450px){header h1{font-size:2.65em}.creative-hero{padding:17px}.mission-grid{grid-template-columns:1fr}}


/* POP ART ACADEMY — modular theme */

.level-card{min-height:260px;padding:135px 13px 14px;background-size:100% 124px;background-position:top center;background-repeat:no-repeat;transition:transform .15s,box-shadow .15s}

/* ARTS ATTACK! — V4 consolidated redesign */
:root{--canvas:#fff5dc;--canvas-dark:#fff0b5;--charcoal:#121021;--ink:#21152b;--line:#21152b}

        {"titre":"Ceci n'est pas une pipe","artiste":"René Magritte","date":"1929"}
      ]
    },
    {
      "periode": "Art contemporain",
      "dates": "depuis 1950",
      "description": "Multiplication des pratiques (pop art, art abstrait, performance, installation, street art, art numérique) et remise en question permanente de la définition de l'œuvre d'art.",
      "oeuvres": [
        {"titre":"Marilyn Diptych","artiste":"Andy Warhol","date":"1962"},
        {"titre":"Les Nanas","artiste":"Niki de Saint Phalle","date":"années 1960-70"},
        {"titre":"Installations à pois","artiste":"Yayoi Kusama","date":"depuis les années 1950"}
      ]
    }
  ],
  "tools": {
    "constraintPools": {
      "outils": ["un coton-tige","un morceau de ficelle","tes doigts uniquement","une brindille","un bout de carton","du papier journal froissé","une éponge","une fourchette","une paille","le dos d'un pinceau","un fil de fer"],
      "matieres": ["de l'encre diluée","de la terre ou du sable","du papier déchiré","du tissu récupéré","de la peinture très épaisse","des végétaux","de la craie grasse","des chutes de papier"],
      "gestes": ["frotter","tamponner","gratter","plier","verser","superposer plusieurs couches","effacer partiellement","tracer sans lever la main"],
      "contraintes": ["sans regarder la feuille","en une seule ligne continue","à deux mains en même temps","en moins de 5 minutes","sans utiliser de noir","en miroir (symétrie)","les yeux fermés pendant 30 secondes","en changeant de main au milieu"]
    },
    "autoeval": [
      {
        "groupe": "Pratiquer les arts plastiques de manière réflexive",
        "items": [
          "J'ai exploré plusieurs pistes avant de choisir ma production finale.",
          "J'ai adapté mes outils, gestes ou matériaux à mon intention.",
          "J'ai mené ma production jusqu'au bout, y compris quand c'était difficile.",
          "J'ai pris des risques plastiques plutôt que de rester sur une solution facile."
        ]
      },
      {
        "groupe": "Présenter et expliciter l'œuvre, la démarche et la pratique",
        "items": [
          "Je peux nommer les outils, matériaux et gestes que j'ai utilisés.",
          "Je peux expliquer les choix que j'ai faits et pourquoi.",
          "J'ai pensé à la façon de présenter ma production (support, espace).",
          "J'ai relié mon travail à une œuvre ou une référence artistique vue en classe."
        ]
      },
      {
        "groupe": "Prendre part au débat sur le fait artistique plasticien",
        "items": [
          "J'ai donné un avis argumenté sur mon travail ou celui d'un camarade.",
          "J'ai écouté et respecté des avis différents du mien.",
          "J'ai posé une question ou une hypothèse sur une œuvre étudiée."
        ]
      }
    ]
  }
}
</script>

<script>
(function(){
  "use strict";

  var DATA = JSON.parse(document.getElementById('data').textContent);
  var STORAGE_KEY = 'atelier_ap_progress_v1';

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ return JSON.parse(raw); }
    }catch(e){}
    return { xp:0, quizDone:{}, cardsOpened:{}, badges:[] };
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  var state = loadState();

  function addXP(n){
    state.xp += n;
    checkBadges();
    saveState();
    renderXP();
  }

  function checkBadges(){
    var totalQuiz = 0;
    for(var i=0;i<DATA.levels.length;i++){
      totalQuiz += DATA.levels[i].questionnements.length;
    }
    var doneCount = 0;
    for(var k in state.quizDone){ if(state.quizDone[k]) doneCount++; }

    var newBadges = [];
    if(doneCount >= 1 && state.badges.indexOf('Premier pas') === -1) newBadges.push('Premier pas');
    if(doneCount >= 3 && state.badges.indexOf('Apprenti plasticien') === -1) newBadges.push('Apprenti plasticien');
    if(doneCount >= 6 && state.badges.indexOf("Œil affûté") === -1) newBadges.push("Œil affûté");
    if(doneCount >= totalQuiz && totalQuiz > 0 && state.badges.indexOf('Artiste accompli') === -1) newBadges.push('Artiste accompli');

    for(var j=0;j<newBadges.length;j++){ state.badges.push(newBadges[j]); }
  }

  function renderXP(){
    var label = document.getElementById('xpLabel');
    var fill = document.getElementById('xpFill');
    label.textContent = state.xp + ' XP';
    var pct = Math.min(100, (state.xp % 200) / 2);
    fill.style.width = pct + '%';
  }

  function findLevel(id){
    for(var i=0;i<DATA.levels.length;i++){ if(DATA.levels[i].id === id) return DATA.levels[i]; }
    return null;
  }
  function findQuestionnement(qid){
    for(var i=0;i<DATA.levels.length;i++){
      var lvl = DATA.levels[i];
      for(var j=0;j<lvl.questionnements.length;j++){
        if(lvl.questionnements[j].id === qid) return { level: lvl, q: lvl.questionnements[j] };
      }
    }
    return null;
  }

  function levelProgress(lvl){
    var total = lvl.questionnements.length;
    var done = 0;
    for(var i=0;i<lvl.questionnements.length;i++){
      if(state.quizDone[lvl.questionnements[i].id]) done++;
    }
    return { done: done, total: total };
  }

  var app = document.getElementById('app');

  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ---------- ROUTES ----------

  function renderHome(){
    app.innerHTML = '';
    var crumbs = el('div','crumbs');
    var c1 = el('span','crumb active','Niveaux');
    var c2 = el('span','crumb','Glossaire général');
    c2.onclick = function(){ renderGlossary(); };
    var c3 = el('span','crumb','🛠️ Outils élève');
    c3.onclick = function(){ renderToolsHub(); };
    var c4 = el('span','crumb','✏️ Techniques');
    c4.onclick = function(){ renderTechniquesHub(); };
    var c5 = el('span','crumb','🖼️ Histoire de l\'art');
    c5.onclick = function(){ renderHistoireArtHub(); };
    crumbs.appendChild(c1); crumbs.appendChild(c2); crumbs.appendChild(c3); crumbs.appendChild(c4); crumbs.appendChild(c5);
    app.appendChild(crumbs);

    var hero = el('section','creative-hero');
    hero.appendChild(el('div','hero-mark','LE STUDIO CRÉATIF · 6e → 3e'));
    hero.appendChild(el('h2',null,'Bienvenue chez ARTS ATTACK!'));
    hero.appendChild(el('p',null,'EXPLORE. CRÉE. EXPOSE. · Douze missions de création, des expériences et des choix d’artiste à expliquer.')); 
    var missionBtn=el('button',null,'JE RELÈVE UN DÉFI !');missionBtn.onclick=function(){renderStudio('6e')};hero.appendChild(missionBtn);hero.appendChild(el('div','mascot-hero',''));hero.appendChild(el('div','attack-logo-art',''));hero.appendChild(el('div','attack-character-art',''));app.appendChild(hero);
    app.appendChild(el('h2','section-title','Choisis ton niveau'));

    var grid = el('div','grid');
    for(var i=0;i<DATA.levels.length;i++){
      (function(lvl){
        var prog = levelProgress(lvl);
        var card = el('div','level-card');
        card.appendChild(el('div','tag', lvl.cycle));
        card.appendChild(el('h3', null, lvl.name));card.appendChild(el('div','art-card-name', ({'6e':'OBSERVER LE MONDE','5e':'TRANSFORMER LES IMAGES','4e':'ESPACE ET TEMPS','3e':'ART ET SOCIÉTÉ'})[lvl.id]));
        card.appendChild(el('p', null, escapeHtml(lvl.tagline)));
        var pw = el('div','level-progress');
        var inner = el('div', null, '');
        inner.style.width = (prog.total ? (prog.done/prog.total*100) : 0) + '%';
        pw.appendChild(inner);
        card.appendChild(pw);
        card.appendChild(el('p', null, '<small>' + prog.done + ' / ' + prog.total + ' questionnements terminés</small>'));
        card.setAttribute('role','button');card.setAttribute('tabindex','0');card.setAttribute('aria-label',lvl.name+' : '+lvl.tagline);card.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();renderLevel(lvl.id)}};card.onclick = function(){ renderLevel(lvl.id); };
        grid.appendChild(card);
      })(DATA.levels[i]);
    }
    app.appendChild(grid);
    app.appendChild(el('div','pop-mini','<img src="assets/icon-palette.svg" alt=""> Observer · expérimenter · créer · expliquer'));

    if(state.badges.length){
      var br = el('div','badge-row');
      for(var b=0;b<state.badges.length;b++){
        br.appendChild(el('span','badge', escapeHtml(state.badges[b])));
      }
      app.appendChild(br);
    }
  }

  function renderLevel(levelId){
    var lvl = findLevel(levelId);
    if(!lvl){ renderHome(); return; }
    app.innerHTML = '';

    var back = el('button','back-link','← Tous les niveaux');
    back.onclick = renderHome;
    app.appendChild(back);

    app.appendChild(el('h2','section-title', lvl.name + ' — ' + lvl.cycle));
    var missionsBtn=el('button','btn sage','🎨 Missions de création '+lvl.name);missionsBtn.onclick=function(){renderStudio(lvl.id)};app.appendChild(missionsBtn);

    var projetBtn = el('button','btn secondary', '📜 Consulter le projet 2025 (non en vigueur)');
    projetBtn.onclick = function(){ renderProgramme2025(lvl.id); };
    app.appendChild(projetBtn);
    app.appendChild(el('div', null, '<div style="height:14px"></div>'));

    for(var i=0;i<lvl.questionnements.length;i++){
      (function(q){
        var card = el('div','q-card');
        card.appendChild(el('h3', null, escapeHtml(q.title)));
        card.appendChild(el('div','desc', escapeHtml(q.intro)));
        var meta = el('div','meta');
        meta.appendChild(el('span','pill', q.notions.length + ' notions'));
        meta.appendChild(el('span','pill', q.quiz.length + ' questions'));
        if(state.quizDone[q.id]) meta.appendChild(el('span','pill', '✓ fait — ' + state.quizDone[q.id] + '/' + q.quiz.length));
        card.appendChild(meta);
        card.onclick = function(){ renderQuestionnement(q.id); };
        app.appendChild(card);
      })(lvl.questionnements[i]);
    }
  }

  function renderQuestionnement(qid){
    var found = findQuestionnement(qid);
    if(!found){ renderHome(); return; }
    var lvl = found.level, q = found.q;
    app.innerHTML = '';

    var back = el('button','back-link', '← ' + lvl.name);
    back.onclick = function(){ renderLevel(lvl.id); };
    app.appendChild(back);

    app.appendChild(el('h2','section-title', q.title));
    app.appendChild(el('p', null, '<em>' + escapeHtml(q.intro) + '</em>'));

    app.appendChild(el('h3', null, '📇 Notions clés — clique pour révéler'));
    for(var i=0;i<q.notions.length;i++){
      (function(n, idx){
        var key = q.id + '-' + idx;
        var card = el('div','card-flip' + (state.cardsOpened[key] ? ' open' : ''));
        card.appendChild(el('div','term', escapeHtml(n.terme)));
        card.appendChild(el('div','def', escapeHtml(n.def)));
        card.appendChild(el('div','hint', state.cardsOpened[key] ? '' : 'toucher pour la définition'));
        card.onclick = function(){
          var wasOpen = card.classList.contains('open');
          card.classList.toggle('open');
          if(!wasOpen && !state.cardsOpened[key]){
            state.cardsOpened[key] = true;
            addXP(2);
          }
        };
        app.appendChild(card);
      })(q.notions[i], i);
    }

    var startBtn = el('button','btn ochre', '✏️ Lancer le quiz (' + q.quiz.length + ' questions)');
    startBtn.onclick = function(){ renderQuiz(qid, 0, 0); };
    app.appendChild(startBtn);

    var defi = el('div','defi-box');
    defi.appendChild(el('h4', null, '🎨 Défi pratique'));
    defi.appendChild(el('p', null, escapeHtml(q.defi)));
    app.appendChild(defi);
  }

  function renderQuiz(qid, index, score){
    var found = findQuestionnement(qid);
    if(!found){ renderHome(); return; }
    var lvl = found.level, q = found.q;

    if(index >= q.quiz.length){
      state.quizDone[q.id] = score;
      addXP(10 + score * 5);
      app.innerHTML = '';
      var back = el('button','back-link', '← ' + q.title);
      back.onclick = function(){ renderQuestionnement(qid); };
      app.appendChild(back);

      var box = el('div','result-box');
      box.appendChild(el('div', null, 'Résultat'));
      box.appendChild(el('div','score', score + ' / ' + q.quiz.length));
      var msg = score === q.quiz.length ? 'Sans faute, bravo !' : (score >= q.quiz.length/2 ? 'Bon travail, continue.' : 'Retente le quiz après avoir relu les notions.');
      box.appendChild(el('p', null, escapeHtml(msg)));
      var retry = el('button','btn secondary', 'Refaire le quiz');
      retry.onclick = function(){ renderQuiz(qid, 0, 0); };
      box.appendChild(retry);
      var toLevel = el('button','btn sage', 'Retour au niveau ' + lvl.name);
      toLevel.onclick = function(){ renderLevel(lvl.id); };
      box.appendChild(toLevel);
      app.appendChild(box);

      if(state.badges.length){
        var br = el('div','badge-row');
        for(var b=0;b<state.badges.length;b++){
          br.appendChild(el('span','badge', escapeHtml(state.badges[b])));
        }
        app.appendChild(br);
      }
      return;
    }

    var item = q.quiz[index];
    app.innerHTML = '';

    var back = el('button','back-link', '← Abandonner le quiz');
    back.onclick = function(){ renderQuestionnement(qid); };
    app.appendChild(back);

    var pw = el('div','quiz-progress');
    for(var i=0;i<q.quiz.length;i++){
      var seg = el('span', i < index ? 'done' : (i === index ? 'current' : ''));
      pw.appendChild(seg);
    }
    app.appendChild(pw);

    var qc = el('div','quiz-q');
    qc.appendChild(el('div','qn', 'Question ' + (index+1) + ' / ' + q.quiz.length));
    qc.appendChild(el('div','qtext', escapeHtml(item.q)));

    var explain = el('div','explain', escapeHtml(item.explain));
    var answered = false;

    for(var c=0;c<item.choices.length;c++){
      (function(choiceText, idx){
        var btn = el('button','choice', escapeHtml(choiceText));
        btn.onclick = function(){
          if(answered) return;
          answered = true;
          var allBtns = qc.querySelectorAll('.choice');
          for(var k=0;k<allBtns.length;k++){ allBtns[k].disabled = true; }
          var isCorrect = idx === item.correct;
          btn.classList.add(isCorrect ? 'correct' : 'wrong');
          if(!isCorrect){
            allBtns[item.correct].classList.add('correct');
          }
          explain.classList.add('show');
          var nextBtn = el('button','btn', index + 1 < q.quiz.length ? 'Question suivante' : 'Voir le résultat');
          nextBtn.onclick = function(){
            renderQuiz(qid, index + 1, score + (isCorrect ? 1 : 0));
          };
          qc.appendChild(nextBtn);
        };
        qc.appendChild(btn);
      })(item.choices[c], c);
    }
    qc.appendChild(explain);
    app.appendChild(qc);
  }

  function renderGlossary(){
    app.innerHTML = '';
    var back = el('button','back-link', '← Accueil');
    back.onclick = renderHome;
    app.appendChild(back);

    app.appendChild(el('h2','section-title', 'Glossaire général'));
    var search = el('input','glossary-search');
    search.type = 'text';
    search.placeholder = 'Rechercher une notion...';
    app.appendChild(search);

    var list = el('div', null, '');
    app.appendChild(list);

    var allTerms = [];
    for(var i=0;i<DATA.levels.length;i++){
      var lvl = DATA.levels[i];
      for(var j=0;j<lvl.questionnements.length;j++){
        var q = lvl.questionnements[j];
        for(var k=0;k<q.notions.length;k++){
          allTerms.push({ terme: q.notions[k].terme, def: q.notions[k].def, niveau: lvl.name });
        }
      }
    }
    allTerms.sort(function(a,b){ return a.terme.localeCompare(b.terme, 'fr'); });

    function renderList(filter){
      list.innerHTML = '';
      var f = filter.toLowerCase();
      for(var i=0;i<allTerms.length;i++){
        var t = allTerms[i];
        if(f && t.terme.toLowerCase().indexOf(f) === -1 && t.def.toLowerCase().indexOf(f) === -1) continue;
        var card = el('div','card-flip open');
        card.appendChild(el('div','term', escapeHtml(t.terme) + ' <span class="pill" style="font-size:0.5em;vertical-align:middle;">' + t.niveau + '</span>'));
        card.appendChild(el('div','def', escapeHtml(t.def)));
        list.appendChild(card);
      }
      if(!list.children.length){
        list.appendChild(el('p', null, 'Aucune notion trouvée.'));
      }
    }
    renderList('');
    search.oninput = function(){ renderList(search.value); };
  }

  // ---------- PROGRAMME 2025 (projet) ----------

  function renderProgramme2025(levelId){
    var lvl = findLevel(levelId);
    if(!lvl){ renderHome(); return; }
    var p25 = DATA.programme2025;
    app.innerHTML = '';

    var back = el('button','back-link', '← ' + lvl.name);
    back.onclick = function(){ renderLevel(lvl.id); };
    app.appendChild(back);

    app.appendChild(el('h2','section-title', 'Projet de programme 2025 — ' + lvl.name));
    var notice = el('div','defi-box', null);
    notice.style.background = 'var(--clay)';
    notice.appendChild(el('p', null, escapeHtml(p25.notice)));
    app.appendChild(notice);

    app.appendChild(el('h3', null, '9 notions plasticiennes cardinales'));
    for(var n=0;n<p25.notionsCardinales.length;n++){
      (function(nc){
        var card = el('div','card-flip');
        card.appendChild(el('div','term', escapeHtml(nc.terme)));
        card.appendChild(el('div','def', escapeHtml(nc.def)));
        card.appendChild(el('div','hint','toucher pour la définition'));
        card.onclick = function(){ card.classList.toggle('open'); };
        app.appendChild(card);
      })(p25.notionsCardinales[n]);
    }

    for(var d=0;d<p25.domaines.length;d++){
      var domaine = p25.domaines[d];
      app.appendChild(el('h3', null, escapeHtml(domaine.nom)));
      for(var a=0;a<domaine.axes.length;a++){
        var axe = domaine.axes[a];
        var card = el('div','q-card', null);
        card.style.cursor = 'default';
        card.appendChild(el('h3', null, escapeHtml(axe.titre)));
        var txt = axe.objectifs[lvl.id];
        card.appendChild(el('div','desc', txt ? escapeHtml(txt) : 'Se référer aux principes généraux du programme.'));
        app.appendChild(card);
      }
    }
  }

  // ---------- OUTILS ÉLÈVE ----------

  var toolsTimerInterval = null;
  function clearToolsTimer(){
    if(toolsTimerInterval){ clearInterval(toolsTimerInterval); toolsTimerInterval = null; }
  }

  function renderToolsHub(){
    clearToolsTimer();
    app.innerHTML = '';
    var back = el('button','back-link', '← Accueil');
    back.onclick = renderHome;
    app.appendChild(back);

    app.appendChild(el('h2','section-title', 'Outils élève'));
    app.appendChild(el('p', null, 'À utiliser directement en classe, en atelier ou en autonomie.'));

    var tools = [
      { icon:'⏱️', title:'Minuteur d\'atelier', desc:'Chronomètre les phases d\'une séance (recherche, pratique, verbalisation).', fn: renderTimer },
      { icon:'🎲', title:'Générateur de contraintes', desc:'Tire une contrainte créative aléatoire pour débloquer une idée.', fn: renderConstraintGenerator },
      { icon:'📓', title:'Carnet de bord', desc:'Note tes idées, tes choix et tes remarques au fil des séances.', fn: renderJournal },
      { icon:'✅', title:'Grille d\'auto-évaluation', desc:'Fais le point sur ta pratique à partir des compétences travaillées.', fn: renderAutoEval }
    ];
    var grid = el('div','grid');
    for(var i=0;i<tools.length;i++){
      (function(t){
        var card = el('div','level-card');
        card.appendChild(el('h3', null, t.icon + ' ' + t.title));
        card.appendChild(el('p', null, escapeHtml(t.desc)));
        card.onclick = function(){ t.fn(); };
        grid.appendChild(card);
      })(tools[i]);
    }
    app.appendChild(grid);
  }

  function renderTimer(){
    clearToolsTimer();
    app.innerHTML = '';
    var back = el('button','back-link', '← Outils élève');
    back.onclick = function(){ clearToolsTimer(); renderToolsHub(); };
    app.appendChild(back);

    app.appendChild(el('h2','section-title', "⏱️ Minuteur d'atelier"));

    var presets = [
      { label:'Recherche / brouillon', minutes:10 },
      { label:'Pratique', minutes:25 },
      { label:'Verbalisation', minutes:10 }
    ];

    var box = el('div','result-box');
    var display = el('div','score', '10:00');
    box.appendChild(el('p', null, 'Phase en cours'));
    var phaseLabel = el('p', null, 'Recherche / brouillon');
    phaseLabel.style.fontWeight = '700';
    box.appendChild(phaseLabel);
    box.appendChild(display);

    var totalSeconds = presets[0].minutes * 60;
    var remaining = totalSeconds;
    var running = false;

    function updateDisplay(){
      var m = Math.floor(remaining/60);
      var s = remaining%60;
      display.textContent = (m<10?'0':'')+m + ':' + (s<10?'0':'')+s;
    }
    updateDisplay();

    var startBtn = el('button','btn ochre', '▶ Démarrer');
    var resetBtn = el('button','btn secondary', '↺ Réinitialiser');

    startBtn.onclick = function(){
      if(running){
        clearToolsTimer();
        running = false;
        startBtn.textContent = '▶ Reprendre';
        return;
      }
      running = true;
      startBtn.textContent = '⏸ Pause';
      toolsTimerInterval = setInterval(function(){
        remaining--;
        if(remaining <= 0){
          remaining = 0;
          updateDisplay();
          clearToolsTimer();
          running = false;
          startBtn.textContent = '▶ Démarrer';
          display.textContent = "Terminé !";
        } else {
          updateDisplay();
        }
      }, 1000);
    };
    resetBtn.onclick = function(){
      clearToolsTimer();
      running = false;
      remaining = totalSeconds;
      startBtn.textContent = '▶ Démarrer';
      updateDisplay();
    };

    box.appendChild(startBtn);
    box.appendChild(resetBtn);
    app.appendChild(box);

    app.appendChild(el('h3', null, 'Choisir une phase'));
    var grid = el('div','grid');
    for(var i=0;i<presets.length;i++){
      (function(p){
        var card = el('div','level-card');
        card.appendChild(el('h3', null, p.label));
        card.appendChild(el('p', null, p.minutes + ' minutes'));
        card.onclick = function(){
          clearToolsTimer();
          running = false;
          totalSeconds = p.minutes*60;
          remaining = totalSeconds;
          phaseLabel.textContent = p.label;
          startBtn.textContent = '▶ Démarrer';
          updateDisplay();
        };
        grid.appendChild(card);
      })(presets[i]);
    }
    app.appendChild(grid);

    app.appendChild(el('h3', null, 'Ou une durée libre'));
    var freeGrid = el('div','grid');
    var free = [5,15,20,30,45];
    for(var f=0;f<free.length;f++){

      return [];

    function saveEntries(entries){
      try{ localStorage.setItem('atelier_ap_journal_v1', JSON.stringify(entries)); }catch(e){}

    function renderEntries(){
      listWrap.innerHTML = '';
      if(!entries.length){
        listWrap.appendChild(el('p', null, 'Aucune note pour le moment.'));
        return;
      }
      for(var i=entries.length-1;i>=0;i--){
        (function(entry, idx){
          var card = el('div','card-flip open');
          card.style.cursor = 'default';
          card.appendChild(el('div','hint', entry.date));
          card.appendChild(el('div','def', escapeHtml(entry.text)));
          var del = el('button','back-link', 'Supprimer');
          del.style.color = 'var(--clay)';
          del.onclick = function(){
            entries.splice(idx,1);
            saveEntries(entries);
            renderEntries();
          };
          card.appendChild(del);
          listWrap.appendChild(card);
        })(entries[i], i);
      }
    }

    addBtn.onclick = function(){
      var val = textarea.value.replace(/^\s+|\s+$/g,'');
      if(!val) return;
      var now = new Date();
      var dateStr = now.toLocaleDateString('fr-FR') + ' ' + now.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
      entries.push({ date: dateStr, text: val });
      saveEntries(entries);
      textarea.value = '';
      renderEntries();
    };

    renderEntries();
  }

  function renderAutoEval(){

        if(raw) return JSON.parse(raw);
      }catch(e){}
      return {};
    }
    function saveChecks(c){
      try{ localStorage.setItem(STORAGE, JSON.stringify(c)); }catch(e){}
    }
    var checks = loadChecks();

    var groups = DATA.tools.autoeval;
    var totalItems = 0, checkedItems = 0;

    for(var g=0;g<groups.length;g++){
      var group = groups[g];
      app.appendChild(el('h3', null, escapeHtml(group.groupe)));
      var card = el('div','q-card');

      for(var i=0;i<group.items.length;i++){
        (function(itemText, key){
          totalItems++;
          var row = document.createElement('label');
          row.style.display = 'flex';
          row.style.alignItems = 'flex-start';
          row.style.gap = '8px';
          row.style.marginBottom = '10px';
          row.style.fontSize = '0.92em';
          row.style.cursor = 'pointer';
          var cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = !!checks[key];
          if(cb.checked) checkedItems++;
          cb.onchange = function(){
            checks[key] = cb.checked;
            saveChecks(checks);
            renderAutoEval();
          };
          var span = document.createElement('span');
          span.textContent = itemText;
          row.appendChild(cb);
          row.appendChild(span);
          card.appendChild(row);
        })(group.items[i], group.groupe + '-' + i);
      }
      app.appendChild(card);
    }

    var summary = el('div','result-box');
    summary.appendChild(el('p', null, 'Bilan'));
    summary.appendChild(el('div','score', checkedItems + ' / ' + totalItems));
    var resetBtn = el('button','btn secondary', 'Tout décocher');
    resetBtn.onclick = function(){
      checks = {};
      saveChecks(checks);
      renderAutoEval();
    };
    summary.appendChild(resetBtn);
    app.appendChild(summary);
  }

  function buildVisual(kind){
    var box = el('div','visual-box');

      wheel.style.background = 'conic-gradient(' + hues.join(',') + ')';

      var svg = '<svg width="260" height="160" viewBox="0 0 260 160" xmlns="http://www.w3.org/2000/svg">' +

    var key='atelier_mission_'+m.id,ta=document.createElement('textarea');ta.setAttribute('aria-label','Ma réflexion sur la mission');ta.placeholder='Mes essais, mes choix, les difficultés, ce que je voudrais améliorer…';try{ta.value=localStorage.getItem(key)||''}catch(e){}s.appendChild(ta);
    var save=el('button','btn sage','Enregistrer ma réflexion');var saved=el('p',null,'');save.onclick=function(){try{localStorage.setItem(key,ta.value);saved.textContent='Réflexion enregistrée sur cet appareil.'}catch(e){saved.textContent='Enregistrement indisponible sur cet appareil.'}};s.appendChild(save);s.appendChild(saved);
    s=section('🏅 Compétence et vocabulaire');s.appendChild(el('p',null,'**'));s.lastChild.textContent=m.competence;s.appendChild(el('p',null,'Notions : '+m.vocab));
    var doneKey='atelier_mission_done_'+m.id,completed=false;try{completed=localStorage.getItem(doneKey)==='yes'}catch(e){};
    var fin=el('button','btn ochre',completed?'✓ Mission déjà réalisée':'J’ai réalisé et expliqué ma production');fin.disabled=completed;
    fin.onclick=function(){if(!ta.value.trim()){saved.textContent='Explique au moins un choix dans ton carnet avant de valider.';ta.focus();return}try{localStorage.setItem(key,ta.value);localStorage.setItem(doneKey,'yes')}catch(e){};fin.disabled=true;fin.textContent='✓ Mission réalisée';addXP(30)};app.appendChild(fin);
  }

  document.querySelectorAll('[data-pop]').forEach(function(button){button.addEventListener('click',function(){var target=button.getAttribute('data-pop');if(target==='home')renderHome();else if(target==='missions')renderStudio('6e');else if(target==='gallery')renderHistoireArtHub();else if(target==='tech')renderTechniquesHub();else if(target==='journal')renderJournal();else if(target==='tools')renderToolsHub();window.scrollTo(0,0)})});
  renderXP();
  renderHome();
})();
</script>
